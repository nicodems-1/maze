[project]
name = "a-maze-ing"
version = "0.1.0"
description = "generate a maze, solve it and display it"
authors = [
    {name = "chafonta, niverdie"}
]
readme = "README.md"
requires-python = ">=3.13"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
mlx = {path = "mlx-2.2-py3-ubuntu-any.whl"}
